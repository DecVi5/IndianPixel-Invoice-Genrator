<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- 6-blade origami aperture icon matching Indian Pixel brand mark -->
  <g transform="translate(250, 250)">
    <!-- Blade 1 (0 deg) -->
    <g transform="rotate(0)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
    <!-- Blade 2 (60 deg) -->
    <g transform="rotate(60)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
    <!-- Blade 3 (120 deg) -->
    <g transform="rotate(120)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
    <!-- Blade 4 (180 deg) -->
    <g transform="rotate(180)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
    <!-- Blade 5 (240 deg) -->
    <g transform="rotate(240)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
    <!-- Blade 6 (300 deg) -->
    <g transform="rotate(300)">
      <polygon points="62,-107 165,-215 110,-55" fill="#000000" />
      <polygon points="110,-55 165,-215 220,-120" fill="#000000" />
      <polygon points="62,-107 110,-55 45,-26" fill="#000000" opacity="0.85" />
    </g>
  </g>
</svg>
