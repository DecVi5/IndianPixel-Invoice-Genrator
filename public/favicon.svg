<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Midnight Green background disc -->
  <rect width="500" height="500" rx="120" fill="#08221B" />
  <!-- White 6-blade origami camera aperture star mark -->
  <g transform="translate(250, 250)">
    <!-- 6 blades rotated by 60 degrees each -->
    <g transform="rotate(0)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
    <g transform="rotate(60)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
    <g transform="rotate(120)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
    <g transform="rotate(180)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
    <g transform="rotate(240)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
    <g transform="rotate(300)">
      <polygon points="62,-107 165,-215 110,-55" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="110,-55 165,-215 220,-120" fill="#ffffff" stroke="#08221B" stroke-width="3" />
      <polygon points="62,-107 110,-55 45,-26" fill="#f0ece1" stroke="#08221B" stroke-width="3" />
    </g>
  </g>
</svg>
